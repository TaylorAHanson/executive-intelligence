schema_version = 1

[agent]
framework = "langgraph"
server = "agentbricks"
deployment_name = "exec-intel-agent"

[memory_store]
name = "exec-intel-agent-memory"

[session_store]
name = "exec-intel-agent-sessions"

[tracing]
experiment_name = "/Shared/agentbricks_traces/executive-intelligence-agent-uc"

# Genie spaces and Unity Catalog MCP services are not bound here: admins attach them to
# contexts in the client's Settings page, and the agent builds their tools per turn as the
# signed-in user (agent/contexts.py, agent/mcp_services.py). Every request must carry the
# user, and the app needs the genie scope for Genie and ai-gateway for MCP services.
[auth.user]
required = true
additional_api_scopes = ["genie", "ai-gateway"]
